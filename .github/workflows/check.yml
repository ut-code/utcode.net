name: Check
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - run: bun install --frozen-lockfile
      - run: bun check
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - run: bun install --frozen-lockfile
      - id: astro-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-astro-build
          path: |
            .astro
            dist
            node_modules/.astro/assets
          restore-keys: ${{ runner.os }}-astro-build
      - run: bun run build
      - if: github.ref == 'refs/heads/main' && steps.astro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ runner.os }}-astro-build
          path: |
            .astro
            dist
            node_modules/.astro/assets
  dirs-small:
    name: All dirs must be small (<5MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run github:ut-code/internal-helpers#disallow-large-dir contents/articles/*/*
      - run: nix run github:ut-code/internal-helpers#disallow-large-dir contents/members/*/*
